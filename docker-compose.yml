name: vesta

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: vesta
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?set APP_OWNER_PASSWORD in .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # Since the 18 image, PGDATA lives under /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, so the temporary init server is not reported as ready
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d vesta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
