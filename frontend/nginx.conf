# Serves the built app and proxies the API, so the browser talks to a single origin (no CORS).
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # The access token lives in sessionStorage (T-02): a strict CSP limits what injected script could do
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (e.g. /goals/<id>) fall back to the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
