spring:
  application:
    name: vesta-backend
  config:
    # Local runs outside Docker (IDE, spring-boot:run) read the repository .env, whether the
    # working directory is the repository root or backend/. Missing files are ignored, and real
    # environment variables (Docker Compose) still take precedence.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Runtime role: no superuser, no BYPASSRLS (ADR-0001)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vesta}
    username: ${DB_APP_USER:app_user}
    password: ${DB_APP_PASSWORD:${APP_USER_PASSWORD:}}
  flyway:
    # Schema owner role, used only for migrations
    user: ${DB_OWNER_USER:app_owner}
    password: ${DB_OWNER_PASSWORD:${APP_OWNER_PASSWORD:}}
    # A database seeded with the "local" profile must still start without it: the demo data is
    # a repeatable migration that is simply not on the path then
    ignore-migration-patterns: "*:future,repeatable:missing"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

vesta:
  jwt:
    # HS256 signing secret, at least 32 bytes (ADR-0002). JWT_SECRET comes from .env or the environment.
    secret: ${JWT_SECRET:}
    ttl: 60m
    issuer: vesta

management:
  endpoints:
    web:
      exposure:
        include: health
